<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00E5FF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 30px Inter,Arial,'Noto Sans SC',sans-serif;fill:#EAFBFF}
      .sub{font:500 15px Inter,Arial,'Noto Sans SC',sans-serif;fill:#A7F3FF}
      .box{fill:#0F172A;stroke:#22D3EE;stroke-width:1.4;rx:16;filter:url(#glow)}
      .box2{fill:#111827;stroke:#8B5CF6;stroke-width:1.4;rx:16;filter:url(#glow)}
      .txt{font:600 18px Inter,Arial,'Noto Sans SC',sans-serif;fill:#F8FAFC}
      .small{font:400 13px Inter,Arial,'Noto Sans SC',sans-serif;fill:#CBD5E1}
      .code{font:500 12px 'JetBrains Mono','SFMono-Regular',monospace;fill:#67E8F9}
      .arrow{stroke:#67E8F9;stroke-width:2.5;marker-end:url(#arrow);fill:none;opacity:.9}
      .grid{stroke:#164E63;stroke-width:.6;opacity:.25}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#67E8F9"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
<line class="grid" x1="0" y1="0" x2="0" y2="680"/><line class="grid" x1="40" y1="0" x2="40" y2="680"/><line class="grid" x1="80" y1="0" x2="80" y2="680"/><line class="grid" x1="120" y1="0" x2="120" y2="680"/><line class="grid" x1="160" y1="0" x2="160" y2="680"/><line class="grid" x1="200" y1="0" x2="200" y2="680"/><line class="grid" x1="240" y1="0" x2="240" y2="680"/><line class="grid" x1="280" y1="0" x2="280" y2="680"/><line class="grid" x1="320" y1="0" x2="320" y2="680"/><line class="grid" x1="360" y1="0" x2="360" y2="680"/><line class="grid" x1="400" y1="0" x2="400" y2="680"/><line class="grid" x1="440" y1="0" x2="440" y2="680"/><line class="grid" x1="480" y1="0" x2="480" y2="680"/><line class="grid" x1="520" y1="0" x2="520" y2="680"/><line class="grid" x1="560" y1="0" x2="560" y2="680"/><line class="grid" x1="600" y1="0" x2="600" y2="680"/><line class="grid" x1="640" y1="0" x2="640" y2="680"/><line class="grid" x1="680" y1="0" x2="680" y2="680"/><line class="grid" x1="720" y1="0" x2="720" y2="680"/><line class="grid" x1="760" y1="0" x2="760" y2="680"/><line class="grid" x1="800" y1="0" x2="800" y2="680"/><line class="grid" x1="840" y1="0" x2="840" y2="680"/><line class="grid" x1="880" y1="0" x2="880" y2="680"/><line class="grid" x1="920" y1="0" x2="920" y2="680"/><line class="grid" x1="960" y1="0" x2="960" y2="680"/><line class="grid" x1="1000" y1="0" x2="1000" y2="680"/><line class="grid" x1="1040" y1="0" x2="1040" y2="680"/><line class="grid" x1="1080" y1="0" x2="1080" y2="680"/><line class="grid" x1="1120" y1="0" x2="1120" y2="680"/><line class="grid" x1="1160" y1="0" x2="1160" y2="680"/><line class="grid" x1="1200" y1="0" x2="1200" y2="680"/><line class="grid" x1="1240" y1="0" x2="1240" y2="680"/><line class="grid" x1="0" y1="0" x2="1280" y2="0"/><line class="grid" x1="0" y1="40" x2="1280" y2="40"/><line class="grid" x1="0" y1="80" x2="1280" y2="80"/><line class="grid" x1="0" y1="120" x2="1280" y2="120"/><line class="grid" x1="0" y1="160" x2="1280" y2="160"/><line class="grid" x1="0" y1="200" x2="1280" y2="200"/><line class="grid" x1="0" y1="240" x2="1280" y2="240"/><line class="grid" x1="0" y1="280" x2="1280" y2="280"/><line class="grid" x1="0" y1="320" x2="1280" y2="320"/><line class="grid" x1="0" y1="360" x2="1280" y2="360"/><line class="grid" x1="0" y1="400" x2="1280" y2="400"/><line class="grid" x1="0" y1="440" x2="1280" y2="440"/><line class="grid" x1="0" y1="480" x2="1280" y2="480"/><line class="grid" x1="0" y1="520" x2="1280" y2="520"/><line class="grid" x1="0" y1="560" x2="1280" y2="560"/><line class="grid" x1="0" y1="600" x2="1280" y2="600"/><line class="grid" x1="0" y1="640" x2="1280" y2="640"/><text class="title" x="52" y="68">Memory Write Pipeline</text><text class="sub" x="54" y="98">不是所有内容都应该写入记忆：先判定、再结构化、可回滚</text><rect class="box" x="60" y="230" width="165" height="150" rx="16"/><text class="txt" x="78" y="280">1. Observe</text><text class="small" x="78" y="312">用户消息 / 工具结果 / 文件变更</text><path class="arrow" d="M225,305 L255,305"/><rect class="box2" x="260" y="230" width="165" height="150" rx="16"/><text class="txt" x="278" y="280">2. Extract</text><text class="small" x="278" y="312">抽取候选事实</text><text class="small" x="278" y="332">事件</text><text class="small" x="278" y="352">技能</text><path class="arrow" d="M425,305 L455,305"/><rect class="box" x="460" y="230" width="165" height="150" rx="16"/><text class="txt" x="478" y="280">3. Classify</text><text class="small" x="478" y="312">fact / episode / skill / ignore</text><path class="arrow" d="M625,305 L655,305"/><rect class="box2" x="660" y="230" width="165" height="150" rx="16"/><text class="txt" x="678" y="280">4. Validate</text><text class="small" x="678" y="312">置信度</text><text class="small" x="678" y="332">冲突</text><text class="small" x="678" y="352">敏感信息检查</text><path class="arrow" d="M825,305 L855,305"/><rect class="box" x="860" y="230" width="165" height="150" rx="16"/><text class="txt" x="878" y="280">5. Upsert</text><text class="small" x="878" y="312">结构化覆盖或追加事件</text><path class="arrow" d="M1025,305 L1055,305"/><rect class="box2" x="1060" y="230" width="165" height="150" rx="16"/><text class="txt" x="1078" y="280">6. Audit</text><text class="small" x="1078" y="312">版本</text><text class="small" x="1078" y="332">来源</text><text class="small" x="1078" y="352">删除与回滚</text><rect class="box" x="245" y="500" width="790" height="78" rx="16"/><text class="small" x="285" y="545">关键原则：热路径只写少量高置信记忆；复杂合并交给后台 consolidation job</text></svg>
