><line class="grid" x1="0" y1="200" x2="1280" y2="200"/><line class="grid" x1="0" y1="240" x2="1280" y2="240"/><line class="grid" x1="0" y1="280" x2="1280" y2="280"/><line class="grid" x1="0" y1="320" x2="1280" y2="320"/><line class="grid" x1="0" y1="360" x2="1280" y2="360"/><line class="grid" x1="0" y1="400" x2="1280" y2="400"/><line class="grid" x1="0" y1="440" x2="1280" y2="440"/><line class="grid" x1="0" y1="480" x2="1280" y2="480"/><line class="grid" x1="0" y1="520" x2="1280" y2="520"/><line class="grid" x1="0" y1="560" x2="1280" y2="560"/><line class="grid" x1="0" y1="600" x2="1280" y2="600"/><line class="grid" x1="0" y1="640" x2="1280" y2="640"/><line class="grid" x1="0" y1="680" x2="1280" y2="680"/><text class="title" x="52" y="68">Mainstream Agent Memory Patterns</text><text class="sub" x="54" y="98">LangGraph · OpenAI Agents SDK · OpenClaw · Hermes Agent</text><rect class="box" x="60" y="185" width="265" height="330" rx="16"/><text class="txt" x="82" y="235">LangGraph / LangChain</text><text class="small" x="82" y="290">thread checkpointer</text><text class="small" x="82" y="335">long-term Store namespace</text><text class="small" x="82" y="380">semantic / episodic / procedural</text><text class="code" x="82" y="450">共同点：把记忆做成系统状态，而不是单一向量库</text><rect class="box2" x="365" y="185" width="265" height="330" rx="16"/><text class="txt" x="387" y="235">OpenAI Agents SDK</text><text class="small" x="387" y="290">Session stores history</text><text class="small" x="387" y="335">SQLite/custom session</text><text class="small" x="387" y="380">conversation continuity</text><text class="code" x="387" y="450">共同点：把记忆做成系统状态，而不是单一向量库</text><rect class="box" x="670" y="185" width="265" height="330" rx="16"/><text class="txt" x="692" y="235">OpenClaw</text><text class="small" x="692" y="290">personal assistant</text><text class="small" x="692" y="335">local context + skills</text><text class="small" x="692" y="380">24/7 proactive memory</text><text class="code" x="692" y="450">共同点：把记忆做成系统状态，而不是单一向量库</text><rect class="box2" x="975" y="185" width="265" height="330" rx="16"/><text class="txt" x="997" y="235">Hermes Agent</text><text class="small" x="997" y="290">closed learning loop</text><text class="small" x="997" y="335">skill creation from experience</text><text class="small" x="997" y="380">FTS session search + modeling</text><text class="code" x="997" y="450">共同点：把记忆做成系统状态，而不是单一向量库</text></svg>
